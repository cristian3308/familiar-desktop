[package]
name = "familiar-core"
description = "A lightweight native clone of Familiar Desktop: dock, top bar, Dynamic Island, widgets and launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "familiar-core"
path = "src/main.rs"

[features]
default = []
# Fallback: winit + OpenGL instead of the built-in layered-window platform.
# Gives DWM blur on the top bar but costs ~40 MB of driver memory per surface.
winit = ["slint/backend-winit", "slint/renderer-femtovg", "slint/unstable-winit-030"]

[dependencies]
familiar-theme.workspace = true
serde.workspace = true
toml.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
familiar-layout.workspace = true
familiar-signal.workspace = true
familiar-store.workspace = true
familiar-sys.workspace = true
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
slint = { version = "~1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-software",
    "raw-window-handle-06",
    "unstable-fontique-011",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
slint-build = "~1.18"
