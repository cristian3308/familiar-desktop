[package]
name = "familiar-theme"
description = "TOML themes with share codes and hot reload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["watch"]
watch = ["dep:notify"]

[dependencies]
serde.workspace = true
toml.workspace = true
log.workspace = true
base64 = "0.22"
notify = { version = "8", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"
